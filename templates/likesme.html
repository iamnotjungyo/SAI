{% load static %}
<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link class="stylesheet" href="{% static 'css/likesme.css' %}" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <title>관심 친구</title>
</head>

<body>

   <div class="phone-container">
        <div class="content-scroll">
            
            <div class="header-wrapper">
                <button class="btn-back" onclick="history.back()">
                    <span class="material-symbols-outlined">chevron_left</span>
                </button>
                <div class="header-text">
                    <h2>관심 친구</h2>
                    <p>본인이 관심을 한 친구 목록</p>
                </div>
            </div>

            <div class="section-title">받은 관심</div>

            <div class="card-list">

                <div class="friend-card">
                    <div class="card-top">
                        <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Jian" alt="지안" class="profile-img">
                        <div class="profile-info">
                            <div class="info-row-1">
                                <span class="name">지안</span>
                                <span class="tag-country">🇰🇷 한국</span>
                                <span class="tag-match match-high">일치 85%</span>
                            </div>
                            <div class="info-row-2">경영학과 3학년 · 사진·커피</div>
                            <div class="info-row-3">
                                <span class="hashtag">#여행</span>
                                <span class="hashtag">#음악</span>
                            </div>
                        </div>
                    </div>
                    <div class="card-divider"></div>
                    <div class="card-bottom">
                        <div class="date-info">
                            <span class="material-symbols-outlined icon-clock">schedule</span>
                            <span>026.02.14</span>
                        </div>
                        <span class="status-badge">대기 중</span>
                        <div class="register"><button>친구추가</button></div>
                    </div>
                </div>

                <div class="friend-card">
                    <div class="card-top">
                        <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=doyoun" alt="도윤" class="profile-img">
                        <div class="profile-info">
                            <div class="info-row-1">
                                <span class="name">도윤</span>
                                <span class="tag-country">🇰🇷 한국</span>
                                <span class="tag-match match-mid">일치 72%</span>
                            </div>
                            <div class="info-row-2">컴퓨터공학과 2학년 · 운동·영화</div>
                            <div class="info-row-3">
                                <span class="hashtag">#축구</span>
                                <span class="hashtag">#넷플릭스</span>
                            </div>
                        </div>
                    </div>
                    <div class="card-divider"></div>
                    <div class="card-bottom">
                        <div class="date-info">
                            <span class="material-symbols-outlined icon-clock">schedule</span>
                            <span>026.02.14</span>
                        </div>
                        <span class="status-badge">대기 중</span>
                        <div class="register"><button>친구추가</button></div>
                    </div>
                </div>

                <div class="friend-card">
                    <div class="card-top">
                        <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=suyeon" alt="수연" class="profile-img">
                        <div class="profile-info">
                            <div class="info-row-1">
                                <span class="name">수연</span>
                                <span class="tag-country">🇰🇷 한국</span>
                                <span class="tag-match match-mid">일치 68%</span>
                            </div>
                            <div class="info-row-2">디자인학과 4학년 · 그림·카페</div>
                            <div class="info-row-3">
                                <span class="hashtag">#일러스트</span>
                                <span class="hashtag">#카페투어</span>
                            </div>
                        </div>
                    </div>
                    <div class="card-divider"></div>
                    <div class="card-bottom">
                        <div class="date-info">
                            <span class="material-symbols-outlined icon-clock">schedule</span>
                            <span>026.02.14</span>
                        </div>
                        <span class="status-badge">대기 중</span>
                        <div class="register">
                            <button>친구추가</button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>

</html>
